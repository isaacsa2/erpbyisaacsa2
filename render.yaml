services:
  - type: web
    name: erp-by-isaac-faculdade
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /login
    envVars:
      - key: DEMO_PUBLIC
        value: "1"
      - key: ERP_COOKIE_SECURE
        value: "1"
      - key: ERP_SECRET_KEY
        generateValue: true
