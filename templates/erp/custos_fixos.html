{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Custos Fixos</h2>

    <!-- Formulário -->
    <form method="POST" class="row g-3 mb-4">
<input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="col-md-4">
            <input type="text" name="name" class="form-control" placeholder="Nome (ex: Aluguel)" required>
        </div>
        <div class="col-md-4">
            <input type="text" name="descricao" class="form-control" placeholder="descrição (Ex: Aluguel do escritório)" required>
        </div>
        <div class="col-md-3">
            <input type="number" step="0.01" name="amount" class="form-control" placeholder="Valor (R$)" required>
        </div>
        <div class="col-md-2">
            <input type="number" name="due_day" class="form-control" placeholder="Dia venc." min="1" max="31" required>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-success w-100">Adicionar</button>
        </div>
    </form>

    <!-- Tabela -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Valor (R$)</th>
                <th>Dia Vencimento</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            {% for c in costs %}
            <tr>
                <td>{{ c.name }}</td>
                <td>R$ {{ c.amount | fmt }}</td>
                <td>{{ c.due_day }}</td>
                <td>{{ c.description }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="4" class="text-center">Nenhum custo fixo cadastrado</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
