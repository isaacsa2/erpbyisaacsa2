name: Testes ERP educacional
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall -q app.py erp.py models.py seed_data.py exemplos tests
      - name: Examples and ERP integration
        run: python -m unittest discover -s tests -v
