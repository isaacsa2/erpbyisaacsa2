name: Testes ERP educacional
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Syntax
        run: python -m compileall -q app.py erp.py models.py seed_data.py exemplos tests
      - name: Examples and ERP integration
        run: python -m unittest discover -s tests -v

  javascript_lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and exercises
        run: |
          node --check static/laboratorio/app.mjs
          node --test static/laboratorio/testes.mjs

  render_demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Modo Aprendiz uses actual source files
        run: python -m unittest checks.test_aprendiz_ast -v
      - name: Public demo security
        env:
          ERP_DEMO_MODE: '1'
        run: python -m unittest checks.test_render_demo -v
